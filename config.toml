baseurl = "https://bloglegacy.insileco.io/"
languageCode = "en-us"
title = "inSileco"
theme = "minimal"
ignoreFiles = ["\\.Rmd$", "_cache$", "\\.Rmarkdown$", "\\.knit\\.md$", "\\.utf8\\.md$", "Rscript/sessionInfo\\.Rmd"]
enableEmoji = true
copyright = "2017-2024 inSileco"
math = false
pygmentsUseClasses = false
summaryLength = 25
# relativeURLs = true

[markup]
    [markup.goldmark]
        [markup.goldmark.renderer]
            unsafe = true
        [markup.goldmark.extensions]
            footnote = true
    [markup.highlight]
        lineNos = true
        noClasses = false
    [markup.tableOfContents]
        endLevel = 2
        startLevel = 2


[permalinks]
    post = "/:year/:month/:day/:slug/"

[[menu.main]]
    name = "About"
    url = "/about/"
[[menu.main]]
    name = "Resources"
    url = "/resource/"
[[menu.main]]
    name = "Posts"
    url = "/post/"
[[menu.main]]
    name = "Consulting"
    url = "https://insileco.io/"

[[menu.icon]]
    url = "/"
    name = "fas fa-home"
    weight = 1
[[menu.icon]]
    url = "https://github.com/inSilecoBlogLegacy/"
    name = "fab fa-github"
    weight = 2
[[menu.icon]]
    url = "https://insileco.github.io/index.xml"
    name = "fas fa-rss"
    weight = 3


[params]
    author = "inSileco"
    description = "Codes, ideas and methods in ecology"
    githubUsername = "#inSileco"
    twitterUsername = "inSileco"
    font = "Lato"
    accent = "#3fb3b2"
    showBorder = true
    backgroundColor = "white"
    highlight = false
    css = [
        "https://cdn.jsdelivr.net/gh/tonsky/FiraCode@1.206/distr/fira_code.css",
        "/css/academicons.min.css",
        "/css/main.css",
        "/css/syntax.css"
    ]
    js = [
        "/js/codecopypaste.js"
    ]

[taxonomies]
    tag = "tags"
    category = "categories"
    rpkg = "rpkgs"
