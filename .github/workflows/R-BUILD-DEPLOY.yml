on:
  push:
    branches: main
  schedule:
    - cron: '0 0 11 * *'

name: build-and-deploy

jobs:
  R-build-blog:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
      - name: Build blogdown
        run: |-
          Rscript -e "icons::download_fontawesome()"
          Rscript -e "blogdown::install_hugo(version = '0.153')"
          Rscript -e "blogdown::check_config()"
          Rscript -e "blogdown::check_content()"
          Rscript -e "blogdown::build_site(build_rmd = TRUE)"
      - name: Deploy inSileco Blog to gh-pages
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
